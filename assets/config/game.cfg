# Window
window.width = 1024
window.height = 768
window.hud_height = 56
window.title = Counter:Strike 2D Simplified

# Update rates
loop.logic_hz = 60
loop.render_hz = 60

# Match rules
match.duration_seconds = 180
match.score_limit = 15
match.player_respawn_seconds = 3
match.bot_respawn_seconds = 5

# Bonuses
bonus.spawn_min_seconds = 6
bonus.spawn_max_seconds = 11
bonus.min_distance = 22
bonus.pickup_radius = 40

# Textures (Kenney Top-Down Shooter pack in assets/tds-assets)
# Set false to disable all textures and use primitive rendering.
textures.enabled = true
textures.player_path = "assets/tds-assets/PNG/Man Blue/manBlue_gun.png"
textures.bot_path = "assets/tds-assets/PNG/Zombie 1/zoimbie1_gun.png"
textures.player_size = 32
textures.bot_size = 32
textures.floor_path = assets/tds-assets/PNG/Tiles/tile_01.png
textures.floor_alt_path = assets/tds-assets/PNG/Tiles/tile_02.png
textures.wall_path = assets/tds-assets/PNG/Tiles/tile_13.png
textures.spawn_player_path = assets/tds-assets/PNG/Tiles/tile_04.png
textures.spawn_bot_path = assets/tds-assets/PNG/Tiles/tile_05.png
textures.bonus_spot_path = assets/tds-assets/PNG/Tiles/tile_03.png
textures.bonus_health_path = assets/tds-assets/PNG/Tiles/tile_534.png
textures.bonus_ammo_path = assets/tds-assets/PNG/weapon_gun.png
textures.bonus_armor_path = assets/tds-assets/PNG/Tiles/tile_505.png
textures.bullet_path = assets/tds-assets/PNG/Tiles/tile_148.png
textures.bonus_pickup_size = 28
textures.bullet_size = 10

# Menu maps
menu.map.simple = assets/maps/de_simple.map
menu.map.crossfire = assets/maps/de_crossfire.map
menu.map.maze_run = assets/maps/de_maze_run.map
menu.map.arena_plus = assets/maps/de_arena_plus.map
